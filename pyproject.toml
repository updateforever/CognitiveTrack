[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-track"
version = "0.1.0"
description = "基于 pytracking 范式的大模型认知长时跟踪框架"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [{name = "CognitiveTrack Contributors"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
qwen = [
  "torch>=2.1",
  "transformers>=4.57.0",
  "qwen-vl-utils>=0.0.14",
  "accelerate>=0.30",
]
train = ["ms-swift>=4.3,<5", "deepspeed==0.19.5"]
annotation = ["openai>=1.40"]
sutrack = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cogtrack*", "pytracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# 这两份文件由公开 SUTrack 推理源码最小迁入；保留其算子布局以确保 checkpoint
# 数值兼容，新增的 runtime/adapter/协议代码仍执行全部 Ruff 规则。
"cogtrack/models/sutrack/network/fastitpn.py" = ["E", "I", "B", "F401"]
"cogtrack/models/sutrack/network/decoder.py" = ["E", "I", "B", "F841"]
