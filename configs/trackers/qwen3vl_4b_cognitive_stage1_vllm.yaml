# 与零样本基线完全相同的 CognitiveTrack v1 正式推理协议，只替换 Stage-1 权重。
# Stage-1 只学过 pair/二字段；在最终协议下测试可直接反映其跨阶段兼容性。
tracker_name: cognitive_vlm
experiment_name: qwen3vl_4b_cognitive_v1_stage1
context_mode: mosaic
bbox_protocol: norm1000

observation_policy:
  type: keyframe

memory:
  enabled: true
  model_output_enabled: true
  semantic_enabled: true
  max_positive_records: 3
  max_semantic_records: 4
  confirmations: 2
  max_confirmation_gap: 30
  min_positive_frame_gap: 5
  min_semantic_frame_gap: 30

model_config: ../models/qwen3vl_4b_vllm_sft.yaml
save_raw_response: true
