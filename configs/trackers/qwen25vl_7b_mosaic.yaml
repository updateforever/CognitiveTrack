tracker_name: cognitive_vlm
experiment_name: qwen25vl_7b_mosaic_v4_memory
context_mode: mosaic
# Qwen2.5-VL 的原生 grounding 约定是“输入图自身像素网格里的绝对坐标”。
# Qwen2.5-VL 零样本与微调均使用 processor-resize 后绝对像素协议。
# 改用 norm1000 时，历史错误实验中 68/69 个观测帧 IoU 恰好为 0。
bbox_protocol: qwen_abs_pixel
observation_policy:
  type: keyframe
memory:
  enabled: true
  semantic_enabled: true
  max_positive_records: 3
  max_semantic_records: 4
  min_semantic_frame_gap: 30
  # 正记忆依赖连续离散判断，而不是 VLM 自报置信度。
  confirmations: 2
model_config: ../models/qwen25vl_7b.yaml
save_raw_response: true
