# CognitiveTrack v1 正式在线推理协议（Qwen3-VL-4B 零样本基线）。
# Tiny 与 Full 必须复用本配置；pair/无记忆等变体只能作为消融实验。
tracker_name: cognitive_vlm
experiment_name: qwen3vl_4b_cognitive_v1_base
context_mode: mosaic
bbox_protocol: norm1000

observation_policy:
  type: keyframe

memory:
  enabled: true
  model_output_enabled: true
  semantic_enabled: true
  max_positive_records: 3
  max_semantic_records: 4
  confirmations: 2
  max_confirmation_gap: 30
  min_positive_frame_gap: 5
  min_semantic_frame_gap: 30

model_config: ../models/qwen3vl_4b_vllm_base.yaml
save_raw_response: true
