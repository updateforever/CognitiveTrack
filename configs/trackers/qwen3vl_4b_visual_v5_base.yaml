# 本地 Hugging Face 单 case 可行性检查；正式并行评测使用对应 vLLM 配置。
tracker_name: cognitive_vlm
experiment_name: qwen3vl_4b_visual_v5_base_hf_smoke
context_mode: mosaic
reference_mode: visual_box
use_init_language: false
mosaic_panel_height: 240
bbox_protocol: norm1000

observation_policy:
  type: keyframe

memory:
  enabled: true
  model_output_enabled: true
  semantic_enabled: true
  max_positive_records: 3
  max_semantic_records: 4
  confirmations: 2
  max_confirmation_gap: 30
  min_positive_frame_gap: 5
  min_semantic_frame_gap: 30
  semantic_confirmations: 2
  max_semantic_confirmation_gap: 300
  min_semantic_text_similarity: 0.35

model_config: ../models/qwen3vl_4b.yaml
save_raw_response: true
