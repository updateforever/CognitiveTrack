# Qwen3-VL-4B 主 baseline：冻结视觉塔，全参训练 LLM 与视觉 merger。
stage: sft
model_family: qwen3_vl
coordinate_protocol: norm1000
qwen_vl_bbox_format: new
tuner_type: full
freeze_llm: false
freeze_vit: true
freeze_aligner: false
distributed_backend: fsdp2
fsdp_strategy: full_shard_auto_wrap
torch_dtype: bfloat16
attn_impl: flash_attn
max_length: 2048
max_pixels: 200704
num_train_epochs: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
world_size: 8
global_batch_size: 16
learning_rate: 0.00001
lr_scheduler_type: cosine
warmup_ratio: 0.05
gradient_checkpointing: false
fsdp_activation_checkpointing: true
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 1
dataset_num_proc: 4
dataloader_num_workers: 2
report_to: none
hardware_note: 8x RTX 4090 24GB, GPU P2P unavailable, NCCL_P2P_DISABLE=1
