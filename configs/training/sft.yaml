# 该文件是 scripts/train_sft.sh 默认参数的可审阅快照；真正启动时，模型与
# 数据路径分别通过必填环境变量 MODEL_PATH、TRAIN_DATA 传入。以下路径均为
# 项目内的可移植示例，不包含开发机绝对路径。
stage: sft
model: models/Qwen2.5-VL-7B-Instruct
dataset: outputs/training/sft_train.jsonl
val_dataset: outputs/training/sft_val.jsonl
output_dir: outputs/sft_qwen_vl
tuner_type: lora
target_modules: all-linear
torch_dtype: bfloat16
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vit: true
max_length: 4096
max_pixels: 200704
attn_impl: flash_attn
gradient_checkpointing: true
warmup_ratio: 0.05
logging_steps: 5
save_steps: 200
save_total_limit: 2
dataset_num_proc: 4
dataloader_num_workers: 4
report_to: none
