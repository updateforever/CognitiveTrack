backend: openai_api
base_url: ${COGTRACK_VLLM_BASE_URL}
model_name: cogtrack-vlt-v640-sft
# API 客户端只读取几 KB 的视觉 processor 配置。复用完整 SFT 模型目录可
# 保证坐标网格与服务端一致，并避免每个评测进程访问缓慢的公共模型 NFS。
processor_path: ${COGTRACK_QWEN3_4B_SFT_MODEL}
api_key_env: LOCAL_VLLM_API_KEY
api_key_fallback: local-test-key

max_image_side: 648
image_format: jpeg
jpeg_quality: 95
timeout_s: 180.0
max_retries: 2
retry_backoff_s: 1.0

max_new_tokens: 128
temperature: 0.0
do_sample: false
