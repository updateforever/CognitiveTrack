backend: openai_api
base_url: ${COGTRACK_VLLM_BASE_URL}
model_name: cogtrack-vlt-v640-sft
processor_path: Qwen3-VL-4B-Instruct
api_key_env: LOCAL_VLLM_API_KEY
api_key_fallback: local-test-key

max_image_side: 648
image_format: jpeg
jpeg_quality: 95
timeout_s: 180.0
max_retries: 2
retry_backoff_s: 1.0

max_new_tokens: 128
temperature: 0.0
do_sample: false
