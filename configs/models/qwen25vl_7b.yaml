backend: huggingface_qwen
model_name: Qwen2.5-VL-7B-Instruct
# 相对目录名由 env.local.yaml 的 model_root 解析。
model_path: Qwen2.5-VL-7B-Instruct
torch_dtype: bfloat16
device_map: auto
attn_implementation: flash_attention_2
processor_use_fast: false
max_new_tokens: 256
temperature: 0.0
do_sample: false
# 只是限制视觉 token 数。注意模型的 bbox 输出活在 processor smart_resize 之后
# 的像素空间里，与该值不完全相等（930x510 -> 648x355 -> 实际 644x364），
# 因此 tracker 必须按 image_grid_thw 回推真实尺寸，不能用此处的值反算。
max_image_side: 648
