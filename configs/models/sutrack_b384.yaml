# SUTrack-B384 公开 checkpoint 的独立推理结构配置。
DATA:
  MULTI_MODAL_LANGUAGE: true
  SEARCH:
    NUMBER: 1
    SIZE: 384
  TEMPLATE:
    NUMBER: 2
    SIZE: 192

MODEL:
  TASK_NUM: 5
  TEXT_ENCODER:
    TYPE: ViT-L/14
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: ""
    PATCHEMBED_INIT: halfcopy
    TOKEN_TYPE_INDICATE: true
    CLASS_TOKEN: true
    POS_TYPE: index
  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: true
  TASK_DECODER:
    NUM_CHANNELS: 256
    FEATURE_TYPE: average

TEST:
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 192
  WINDOW: true
  NUM_TEMPLATES: 2
  UPDATE_INTERVALS:
    DEFAULT: 25
  UPDATE_THRESHOLD:
    DEFAULT: 0.70
