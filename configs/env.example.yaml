# 复制为 env.local.yaml 后按本机情况修改；env.local.yaml 不提交版本库。
# 相对路径以 project_root 为基准；此示例不含任何开发机绝对路径。
project_root: ..
dataset_root: ../data
model_root: ../models
output_root: ./outputs

datasets:
  # CognitiveBench 标注随仓库发布，图像由下面三个公开数据集根解析。
  cognitivebench: ./benchmarks/cognitivebench/v1
  lasot: ../data/LaSOT
  tnl2k: ../data/TNL2K
  mgit: ../data/MGIT

# 可用环境变量覆盖敏感或机器相关配置：
# COGTRACK_DATASET_ROOT、COGTRACK_MODEL_ROOT、COGTRACK_OUTPUT_ROOT。
